/* ============================================================
   2. LANGUAGE SWITCHING
   ============================================================ */
function setLang(lang){
  const dict = I18N[lang] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[k] != null) el.innerHTML = dict[k];
    else if(I18N.en[k] != null) el.innerHTML = I18N.en[k];
  });
  document.documentElement.lang = lang;
  // Arabic flips the page to RTL, but the language bar itself stays
  // anchored in the same place via the base .langbar rules.
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('.langbar button')
    .forEach(b=>b.classList.toggle('active', b.dataset.lang === lang));
  document.title = (lang === 'ar') ? 'برجيس — وثيقة تصميم اللعبة'
                 : (lang === 'jp') ? 'バルシース — ゲームデザインドキュメント'
                 : (lang === 'ko') ? '바르지스 — 게임 디자인 문서'
                 : 'Barjees — Game Design Document';
  try{ localStorage.setItem('barjees_lang', lang); }catch(e){}
}
document.querySelectorAll('.langbar button').forEach(b=>{
  b.addEventListener('click', ()=>setLang(b.dataset.lang));
});



/* ============================================================
   4. MOVEMENT DIAGRAM SVGs — modelled on the real Sawb:
      a 19x19 cross (arms 3 cells wide x 8 long) with a 3x3
      star Matbakh centre and eight Magard (safe) squares.
   ============================================================ */
const CS=10;                          // one cell = 10 units
function cx(c){return c*CS+CS/2;}
function cy(r){return r*CS+CS/2;}
// Magard (safe) squares read from the traditional board, as [col,row]
const SAFE=[[8,2],[10,2],[2,8],[2,10],[16,8],[16,10],[8,16],[10,16]];
const SAFEKEY=new Set(SAFE.map(p=>p[0]+','+p[1]));

function starPoints(x0,y0,outer,inner,points){
  const pts=[];
  for(let i=0;i<points*2;i++){
    const r=(i%2===0)?outer:inner;
    const a=Math.PI*i/points - Math.PI/2;
    pts.push((x0+r*Math.cos(a)).toFixed(2)+','+(y0+r*Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}

function baseBoard(){
  let s='<defs>'
    +'<marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">'
    +'<path d="M0,0 L5,2.5 L0,5 z" fill="#a4341f"/></marker>'
    +'<marker id="arrg" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">'
    +'<path d="M0,0 L5,2.5 L0,5 z" fill="#1f6f6b"/></marker>'
    +'</defs>';
  // central Matbakh: gold square + 8-point star
  s+='<rect x="80" y="80" width="30" height="30" rx="2" fill="#e8c56e" stroke="#8f6512" stroke-width="0.8"/>';
  s+='<polygon points="'+starPoints(95,95,15,6.5,8)+'" fill="#b8892b" stroke="#7a5a12" stroke-width="0.8"/>';
  for(let r=0;r<19;r++)for(let c=0;c<19;c++){
    const inCross=(c>=8&&c<=10)||(r>=8&&r<=10);
    if(!inCross) continue;
    if(c>=8&&c<=10&&r>=8&&r<=10) continue;          // centre drawn above
    const safe=SAFEKEY.has(c+','+r);
    const fill=safe?'#d8efdc':'#efe3c8';
    const stroke=safe?'#7bbd88':'#cbb98f';
    const x=c*CS, y=r*CS;
    s+='<rect x="'+(x+0.4)+'" y="'+(y+0.4)+'" width="'+(CS-0.8)+'" height="'+(CS-0.8)
      +'" rx="1.2" fill="'+fill+'" stroke="'+stroke+'" stroke-width="0.6"/>';
    if(safe) s+='<text x="'+(cx(c)+0.2)+'" y="'+(cy(r)+2.6)+'" font-size="6" font-weight="bold" fill="#1e6b32" text-anchor="middle" font-family="Verdana">✕</text>';
  }
  return s;
}
function piece(c,r,color){
  const col = color==='red' ? '#c0392b' : (color==='green' ? '#2e8b57' : '#2b3340');
  return '<circle cx="'+cx(c)+'" cy="'+cy(r)+'" r="4.6" fill="#ffffff" opacity="0.8"/>'
       + '<circle cx="'+cx(c)+'" cy="'+cy(r)+'" r="3.6" fill="'+col+'" stroke="#ffffff" stroke-width="0.9"/>';
}
function arrow(x1,y1,x2,y2,color,dash){
  const m = color==='green' ? 'arrg' : 'arr';
  const stroke = color==='green' ? '#1f6f6b' : '#a4341f';
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+stroke+'" stroke-width="1.8" '
    +(dash?'stroke-dasharray="3 2" ':'')+'marker-end="url(#'+m+')"/>';
}

const DIAGRAMS = [
  { tag:'diagrams.tag', title:'diagrams.birth_title', cap:'diagrams.birth_cap',
    draw(){
      let s=baseBoard();
      s+=piece(9,9,'black');
      s+=arrow(cx(9), 84, cx(9), 22);
      s+=piece(9,1,'green');
      return s;
    }},
  { tag:'diagrams.tag', title:'diagrams.dir_title', cap:'diagrams.dir_cap',
    draw(){
      let s=baseBoard();
      // counter-clockwise loop following the track cells
      const loop='85,5 85,85 5,85 5,105 85,105 85,185 105,185 105,105 185,105 185,85 105,85 105,5 85,5';
      s+='<polyline points="'+loop+'" fill="none" stroke="#a4341f" stroke-width="1.4" stroke-dasharray="4 2.5" opacity="0.85"/>';
      s+=arrow(103,5, 87,5,'red');       // top tip -> left
      s+=arrow(5,87, 5,103,'red');       // left tip -> down
      s+=arrow(87,185, 103,185,'red');   // bottom tip -> right
      s+=arrow(185,103, 185,87,'red');   // right tip -> up
      return s;
    }},
  { tag:'diagrams.tag', title:'diagrams.cap_title', cap:'diagrams.cap_cap',
    draw(){
      let s=baseBoard();
      s+=piece(4,8,'red');
      s+=piece(6,8,'black');
      s+=arrow(cx(6)-4,cy(8), cx(4)+5,cy(8),'red',true);
      s+=arrow(cx(4),cy(8)+5, 86,92,'red',true);
      return s;
    }},
  { tag:'diagrams.tag', title:'diagrams.safe_title', cap:'diagrams.safe_cap',
    draw(){
      let s=baseBoard();
      s+=piece(2,8,'red');
      s+=piece(16,10,'green');
      s+=piece(8,2,'black');
      return s;
    }},
  { tag:'diagrams.tag', title:'diagrams.banj_title', cap:'diagrams.banj_cap',
    draw(){
      let s=baseBoard();
      // Banj Jump: a piece that reaches the Matbakh's inner corner during a
      // Banj move (with steps to spare) leaps over to the opposite lane.
      // It launches from an OUTER lane at the corner (never the middle lane).
      s+=piece(7,8,'black');
      s+='<path d="M '+(cx(7)+6)+' '+cy(8)+' Q 95 95 '+(cx(11)-6)+' '+cy(8)
        +'" fill="none" stroke="#1f6f6b" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arrg)"/>';
      s+=piece(11,8,'green');
      return s;
    }},
  { tag:'diagrams.tag', title:'diagrams.win_title', cap:'diagrams.win_cap',
    draw(){
      let s=baseBoard();
      [[8,8],[10,8],[8,10],[10,10]].forEach(p=>{ s+=piece(p[0],p[1],'green'); });
      return s;
    }}
];

(function buildDiagrams(){
  const grid=document.getElementById('diagrams-grid');
  DIAGRAMS.forEach(d=>{
    const wrap=document.createElement('div');
    wrap.className='diagram';
    wrap.innerHTML='<span class="diagram-tag" data-i18n="'+d.tag+'"></span>'
      +'<svg viewBox="0 0 190 190" role="img">'+d.draw()+'</svg>'
      +'<h4 data-i18n="'+d.title+'"></h4>'
      +'<p data-i18n="'+d.cap+'"></p>';
    grid.appendChild(wrap);
  });
})();

/* ============================================================
   4b. DECORATIVE ARABESQUE / MOSAIC DIVIDERS BETWEEN SECTIONS
   Inserts an ornamented divider (mosaic rule + khatam star +
   mosaic rule) ahead of every section after the first.
   ============================================================ */
(function buildDividers(){
  const wrap=document.querySelector('.wrap');
  if(!wrap) return;
  const secs=[].filter.call(wrap.children, el=>el.tagName==='SECTION');
  const star='<svg class="sd-star" viewBox="0 0 48 48" aria-hidden="true">'
    +'<g fill="none" stroke="currentColor" stroke-width="1.4">'
    +'<rect x="10" y="10" width="28" height="28"/>'
    +'<rect x="10" y="10" width="28" height="28" transform="rotate(45 24 24)"/>'
    +'<circle cx="24" cy="24" r="6"/></g>'
    +'<circle cx="24" cy="24" r="2.4" fill="currentColor"/></svg>';
  secs.forEach((sec)=>{
    const d=document.createElement('div');
    d.className='sect-divider';
    d.setAttribute('aria-hidden','true');
    d.innerHTML='<span class="sd-rule"></span>'+star+'<span class="sd-rule"></span>';
    sec.parentNode.insertBefore(d, sec);
  });
})();

/* ============================================================
   4c. BOARD-PHOTO CROPS FOR SECTION 05 LEGEND SWATCHES
   Reuses the embedded board photograph so the legend chips show
   real crops (centre star, track square, Magard ✕) rather than
   invented colours that do not appear on the board.
   ============================================================ */
(function cropLegendSwatches(){
  const photo=document.querySelector('.board-photo');
  if(!photo || !photo.src) return;
  document.querySelectorAll('.legend .swatch').forEach(el=>{
    el.style.backgroundImage='url("'+photo.src+'")';
  });
})();

/* ============================================================
   5. INIT
   ============================================================ */
(function init(){
  let saved='en';
  try{ saved = localStorage.getItem('barjees_lang') || 'en'; }catch(e){}
  if(!I18N[saved]) saved='en';
  setLang(saved);
})();
</script>
