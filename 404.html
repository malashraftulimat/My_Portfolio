<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | M ALASHRAF TOLIMAT</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#11151c">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
    <style>
        :root { --accent: #ff6a00; --accentHover: #cc5500; --gold: #d4af37; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-color: #11151c; color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif; text-align: center; padding: 24px;
            background-image:
                radial-gradient(circle at 12% 8%, rgba(212,175,55,0.10), transparent 42%),
                radial-gradient(circle at 88% 92%, rgba(0,224,255,0.08), transparent 45%);
        }
        .card { max-width: 520px; }
        .crest { width: 160px; height: auto; margin-bottom: 16px; }
        .code {
            font-size: 72px; font-weight: 900; letter-spacing: 0.06em; margin: 0;
            background: linear-gradient(90deg, #d4af37, #f6e6a8, #00e0ff, #ff6a00);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font-size: 22px; font-weight: 700; margin: 8px 0 12px; text-transform: uppercase; letter-spacing: 0.1em; }
        p { color: #9aa4b2; line-height: 1.6; margin: 0 0 28px; }
        a.btn {
            display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
            font-weight: 700; padding: 12px 28px; border-radius: 6px; transition: background 0.2s ease;
        }
        a.btn:hover { background: var(--accentHover); }
    </style>
</head>
<body>
    <div class="card">
        <img class="crest" src="7aSanki-crest.webp" alt="" onerror="this.style.display='none'">
        <p class="code">404</p>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a class="btn" href="/My_Portfolio/">Back to portfolio</a>
    </div>
</body>
</html>
