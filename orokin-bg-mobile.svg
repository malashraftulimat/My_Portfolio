<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <g id="hex">
      <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z"/>
    </g>
    <g id="petal">
      <path d="M0 -14 C 8 -24 8 -34 0 -42 C -8 -34 -8 -24 0 -14 Z"/>
    </g>

    <!-- full kaleidoscope cluster (same density as desktop) -->
    <g id="cluster">
      <rect x="-270" y="-270" width="540" height="540" transform="rotate(45)" stroke="#4a4a86" stroke-opacity="0.40" stroke-width="2"/>
      <rect x="-198" y="-198" width="396" height="396" transform="rotate(45)" fill="#363669" fill-opacity="0.20" stroke="#5a5a9e" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="-140" y="-140" width="280" height="280" transform="rotate(45)" fill="#29294f" fill-opacity="0.32" stroke="#6a6ab0" stroke-opacity="0.40" stroke-width="1.5"/>

      <g stroke="#5a5a9e" stroke-opacity="0.40" stroke-width="2">
        <rect x="-330" y="-55" width="110" height="110" transform="rotate(45 -275 0)"/>
        <rect x="220" y="-55" width="110" height="110" transform="rotate(45 275 0)"/>
        <rect x="-55" y="-330" width="110" height="110" transform="rotate(45 0 -275)"/>
        <rect x="-55" y="220" width="110" height="110" transform="rotate(45 0 275)"/>
        <rect x="-270" y="-270" width="90" height="90" transform="rotate(45 -225 -225)"/>
        <rect x="180" y="-270" width="90" height="90" transform="rotate(45 225 -225)"/>
        <rect x="-270" y="180" width="90" height="90" transform="rotate(45 -225 225)"/>
        <rect x="180" y="180" width="90" height="90" transform="rotate(45 225 225)"/>
      </g>
      <g fill="#3a3a6e" fill-opacity="0.28">
        <rect x="-285" y="-35" width="70" height="70" transform="rotate(45 -250 0)"/>
        <rect x="215" y="-35" width="70" height="70" transform="rotate(45 250 0)"/>
        <rect x="-35" y="-285" width="70" height="70" transform="rotate(45 0 -250)"/>
        <rect x="-35" y="215" width="70" height="70" transform="rotate(45 0 250)"/>
      </g>
      <g stroke="#6a6ab0" stroke-opacity="0.32" stroke-width="1.5">
        <circle cx="-275" cy="0" r="28"/>
        <circle cx="275" cy="0" r="28"/>
        <circle cx="0" cy="-275" r="28"/>
        <circle cx="0" cy="275" r="28"/>
      </g>

      <!-- central gold emblem -->
      <g transform="rotate(90)">
        <use href="#hex" transform="scale(1.35)" stroke="#e8d9a0" stroke-opacity="0.85" stroke-width="4"/>
        <use href="#hex" transform="scale(1.12)" stroke="#e8d9a0" stroke-opacity="0.50" stroke-width="2.5"/>
        <use href="#hex" transform="scale(0.92)" fill="#1a1a22" stroke="#e8d9a0" stroke-opacity="0.8" stroke-width="2"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="#e8d9a0"/>
      <g stroke="#e8d9a0" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(120)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(240)"/>
        <use href="#petal" transform="rotate(300)"/>
      </g>

      <!-- Tenno script strokes -->
      <g stroke="#e8d9a0" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-360 -250 c 34 -12 66 -2 82 22 c 5 -29 26 -44 53 -44 l -22 29 l 26 5 l -34 22"/>
      </g>
    </g>
  </defs>

  <!-- smoky wisps -->
  <g fill="#2c2c35" opacity="0.5">
    <path d="M0 0 C 120 70 190 180 170 300 C 150 190 80 110 0 70 Z"/>
    <path d="M1080 0 C 960 70 890 180 910 300 C 930 190 1000 110 1080 70 Z"/>
    <path d="M0 1920 C 120 1850 190 1740 170 1620 C 150 1730 80 1810 0 1850 Z"/>
    <path d="M1080 1920 C 960 1850 890 1740 910 1620 C 930 1730 1000 1810 1080 1850 Z"/>
  </g>

  <!-- portrait composition: one mirrored pair, exactly like the desktop scene.
       right side uses a negative x-scale so both clusters mirror each other. -->
  <use href="#cluster" transform="translate(270 960) scale(0.62)"/>
  <use href="#cluster" transform="translate(810 960) scale(-0.62 0.62)"/>
</svg>
