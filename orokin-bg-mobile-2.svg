<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <g id="hex">
      <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z"/>
    </g>
    <g id="petal">
      <path d="M0 -14 C 8 -24 8 -34 0 -42 C -8 -34 -8 -24 0 -14 Z"/>
    </g>

    <g id="cluster2">
      <rect x="-250" y="-250" width="500" height="500" transform="rotate(45)" stroke="#4a4a86" stroke-opacity="0.40" stroke-width="2"/>
      <rect x="-184" y="-184" width="368" height="368" transform="rotate(22.5)" fill="#363669" fill-opacity="0.20" stroke="#5a5a9e" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="-130" y="-130" width="260" height="260" transform="rotate(45)" fill="#29294f" fill-opacity="0.32" stroke="#6a6ab0" stroke-opacity="0.40" stroke-width="1.5"/>

      <g stroke="#5a5a9e" stroke-opacity="0.40" stroke-width="2">
        <rect x="-310" y="-50" width="100" height="100" transform="rotate(45 -260 0)"/>
        <rect x="210" y="-50" width="100" height="100" transform="rotate(45 260 0)"/>
        <rect x="-50" y="-310" width="100" height="100" transform="rotate(45 0 -260)"/>
        <rect x="-50" y="210" width="100" height="100" transform="rotate(45 0 260)"/>
      </g>
      <g fill="#3a3a6e" fill-opacity="0.28">
        <rect x="-265" y="-32" width="64" height="64" transform="rotate(45 -233 0)"/>
        <rect x="201" y="-32" width="64" height="64" transform="rotate(45 233 0)"/>
        <rect x="-32" y="-265" width="64" height="64" transform="rotate(45 0 -233)"/>
        <rect x="-32" y="201" width="64" height="64" transform="rotate(45 0 233)"/>
      </g>

      <g transform="rotate(45)">
        <use href="#hex" transform="scale(1.25)" stroke="#e8d9a0" stroke-opacity="0.8" stroke-width="4"/>
        <use href="#hex" transform="scale(1.04)" stroke="#e8d9a0" stroke-opacity="0.45" stroke-width="2.5"/>
        <use href="#hex" transform="scale(0.86)" fill="#1a1a22" stroke="#e8d9a0" stroke-opacity="0.75" stroke-width="2"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="#e8d9a0"/>
      <g stroke="#e8d9a0" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(120)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(240)"/>
        <use href="#petal" transform="rotate(300)"/>
      </g>
    </g>
  </defs>

  <g fill="#2c2c35" opacity="0.5">
    <path d="M0 0 C 120 70 190 180 170 300 C 150 190 80 110 0 70 Z"/>
    <path d="M1080 0 C 960 70 890 180 910 300 C 930 190 1000 110 1080 70 Z"/>
    <path d="M0 1920 C 120 1850 190 1740 170 1620 C 150 1730 80 1810 0 1850 Z"/>
    <path d="M1080 1920 C 960 1850 890 1740 910 1620 C 930 1730 1000 1810 1080 1850 Z"/>
  </g>

  <!-- portrait composition: 2x2 mirrored grid, exactly like the desktop scene.
       each right-hand cluster mirrors its left-hand partner. -->
  <use href="#cluster2" transform="translate(270 520) scale(0.5)"/>
  <use href="#cluster2" transform="translate(810 520) scale(-0.5 0.5)"/>
  <use href="#cluster2" transform="translate(270 1400) scale(0.5)"/>
  <use href="#cluster2" transform="translate(810 1400) scale(-0.5 0.5)"/>
</svg>
