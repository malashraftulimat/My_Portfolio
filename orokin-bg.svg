<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <g id="hex">
      <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z"/>
    </g>
    <g id="petal">
      <path d="M0 -14 C 8 -24 8 -34 0 -42 C -8 -34 -8 -24 0 -14 Z"/>
    </g>

    <!-- reusable kaleidoscope cluster (drawn once, mirrored on each side) -->
    <g id="cluster">
      <rect x="-270" y="-270" width="540" height="540" transform="rotate(45)" stroke="#4a4a86" stroke-opacity="0.40" stroke-width="2"/>
      <rect x="-198" y="-198" width="396" height="396" transform="rotate(45)" fill="#363669" fill-opacity="0.20" stroke="#5a5a9e" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="-140" y="-140" width="280" height="280" transform="rotate(45)" fill="#29294f" fill-opacity="0.32" stroke="#6a6ab0" stroke-opacity="0.40" stroke-width="1.5"/>

      <g stroke="#5a5a9e" stroke-opacity="0.40" stroke-width="2">
        <rect x="-390" y="-55" width="110" height="110" transform="rotate(45 -335 0)"/>
        <rect x="280" y="-55" width="110" height="110" transform="rotate(45 335 0)"/>
        <rect x="-55" y="-390" width="110" height="110" transform="rotate(45 0 -335)"/>
        <rect x="-55" y="280" width="110" height="110" transform="rotate(45 0 335)"/>
        <rect x="-330" y="-330" width="90" height="90" transform="rotate(45 -285 -285)"/>
        <rect x="240" y="-330" width="90" height="90" transform="rotate(45 285 -285)"/>
        <rect x="-330" y="240" width="90" height="90" transform="rotate(45 -285 285)"/>
        <rect x="240" y="240" width="90" height="90" transform="rotate(45 285 285)"/>
      </g>
      <g fill="#3a3a6e" fill-opacity="0.28">
        <rect x="-345" y="-35" width="70" height="70" transform="rotate(45 -310 0)"/>
        <rect x="275" y="-35" width="70" height="70" transform="rotate(45 310 0)"/>
        <rect x="-35" y="-345" width="70" height="70" transform="rotate(45 0 -310)"/>
        <rect x="-35" y="275" width="70" height="70" transform="rotate(45 0 310)"/>
      </g>
      <g stroke="#6a6ab0" stroke-opacity="0.32" stroke-width="1.5">
        <circle cx="-335" cy="0" r="28"/>
        <circle cx="335" cy="0" r="28"/>
        <circle cx="0" cy="-335" r="28"/>
        <circle cx="0" cy="335" r="28"/>
      </g>

      <!-- central gold emblem -->
      <g transform="rotate(90)">
        <use href="#hex" transform="scale(1.35)" stroke="#e8d9a0" stroke-opacity="0.85" stroke-width="4"/>
        <use href="#hex" transform="scale(1.12)" stroke="#e8d9a0" stroke-opacity="0.50" stroke-width="2.5"/>
        <use href="#hex" transform="scale(0.92)" fill="#1a1a22" stroke="#e8d9a0" stroke-opacity="0.8" stroke-width="2"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="#e8d9a0"/>
      <g stroke="#e8d9a0" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(120)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(240)"/>
        <use href="#petal" transform="rotate(300)"/>
      </g>

      <!-- Tenno script strokes -->
      <g stroke="#e8d9a0" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-360 -250 c 34 -12 66 -2 82 22 c 5 -29 26 -44 53 -44 l -22 29 l 26 5 l -34 22"/>
      </g>
    </g>
  </defs>

  <!-- symmetric smoky corner wisps -->
  <g fill="#2c2c35" opacity="0.55">
    <path d="M0 1080 C 150 990 250 850 220 690 C 200 830 110 930 0 985 Z"/>
    <path d="M1920 1080 C 1770 990 1670 850 1700 690 C 1720 830 1810 930 1920 985 Z"/>
    <path d="M0 0 C 150 90 250 230 220 390 C 200 250 110 150 0 95 Z"/>
    <path d="M1920 0 C 1770 90 1670 230 1700 390 C 1720 250 1810 150 1920 95 Z"/>
  </g>

  <!-- mirrored clusters, balanced on both sides -->
  <use href="#cluster" transform="translate(1560 540) scale(0.9)"/>
  <use href="#cluster" transform="translate(360 540) scale(-0.9 0.9)"/>
</svg>
